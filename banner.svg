<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="900" height="180" fill="url(#bg)" rx="12"/>
  <rect x="0" y="155" width="900" height="3" fill="url(#accent)" rx="2"/>
  <!-- grid lines decorative -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#21262d" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="155" stroke="#21262d" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="155" stroke="#21262d" stroke-width="1"/>
  <!-- dot pattern right -->
  <circle cx="750" cy="30" r="2" fill="#2ea043" opacity="0.6"/>
  <circle cx="775" cy="30" r="2" fill="#2ea043" opacity="0.4"/>
  <circle cx="800" cy="30" r="2" fill="#2ea043" opacity="0.2"/>
  <circle cx="825" cy="30" r="2" fill="#2ea043" opacity="0.6"/>
  <circle cx="850" cy="30" r="2" fill="#2ea043" opacity="0.3"/>
  <circle cx="750" cy="55" r="2" fill="#2ea043" opacity="0.3"/>
  <circle cx="775" cy="55" r="2" fill="#2ea043" opacity="0.6"/>
  <circle cx="800" cy="55" r="2" fill="#2ea043" opacity="0.4"/>
  <circle cx="825" cy="55" r="2" fill="#2ea043" opacity="0.2"/>
  <circle cx="850" cy="55" r="2" fill="#2ea043" opacity="0.5"/>
  <!-- Name -->
  <text x="48" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="-1">Ruben Morcillo</text>
  <text x="48" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#3fb950" letter-spacing="-1">Calero</text>
  <!-- subtitle -->
  <text x="48" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="3">DATA ANALYTICS  ·  FINANCIAL RISK  ·  AMSTERDAM</text>
</svg>
